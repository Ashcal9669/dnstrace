[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dnstrace"
version = "0.3.0"
description = "Experimental DNS execution tracer"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ash Calili" }]
dependencies = [
  "aioquic>=1.2.0",
  "dnspython>=2.7.0",
  "httpx[http2]>=0.27.0",
  "rich>=13.9.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
dnstrace = "dnstrace.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["dnstrace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
